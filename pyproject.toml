[project]
name = "idb-sim-workspace"
version = "0.1.0"
description = "Industrial Dexterity Benchmark (IDB) datacenter simulation environments for Isaac Sim and Isaac Lab, following WireCraft's architecture."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "gymnasium>=1.0",
    "idb-assets",
    "idb-tasks",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "torch>=2.4",
    "usd-core>=24.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.workspace]
members = ["source/idb_assets", "source/idb_tasks"]

[tool.uv.sources]
idb_assets = { workspace = true }
idb_tasks = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
